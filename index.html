<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1830">
<title>Nikdy jsem · Roman & Saisuni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Sriracha&family=Mali:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column — a night-blue table with a stack of lined index cards, answer pad below, partner's card flips open. */
:root{
  --night:#1b1830; --night-2:#262143; --ink-soft:#a9a3c9;
  --paper:#fbf7ec; --paper-ink:#2a2540; --rule:#c9d8ef; --margin:#ef8f9a;
  --yes:#ff5d8f; --no:#36b9a8; --lamp:#ffd27a; --line:#3a345e;
  --hand:"Caveat","Sriracha",cursive;
  --ui:"Mali","Sriracha",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}[hidden]{display:none!important}button{font:inherit}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:radial-gradient(1200px 700px at 50% -10%,#3a2f5f 0%,var(--night) 55%) fixed,var(--night);color:#f2effa;font-family:var(--ui);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--hand);font-size:34px;font-weight:700;line-height:1;color:var(--lamp);letter-spacing:.5px}
.brand small{display:block;font-family:var(--ui);font-size:12px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.seg{display:inline-flex;background:var(--night-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--ink-soft);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--lamp);color:#2a2112}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:13px;padding:5px 11px;border-radius:999px;border:1px dashed var(--line);color:var(--ink-soft)}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--lamp);color:var(--lamp);background:rgba(255,210,122,.08)}
.chip.spicy[aria-pressed="true"]{border-color:var(--yes);color:var(--yes);background:rgba(255,93,143,.1)}
.status{font-size:12.5px;color:var(--ink-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#6b6590;flex:none}
.dot.on{background:#5be3a2;box-shadow:0 0 0 3px rgba(91,227,162,.18)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:#fff;border-color:var(--lamp)}

/* card stack */
.table{position:relative;perspective:1400px;min-height:270px}
.stack{position:absolute;inset:0;pointer-events:none}
.stack i{position:absolute;inset:6px 4px -6px;background:#e9e3d2;border-radius:6px;transform:rotate(-2.5deg);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.stack i+i{transform:rotate(1.8deg);background:#f1ecdc;inset:3px 2px -3px}
.card{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;min-height:270px;padding:22px 22px 18px 54px;
  background-image:linear-gradient(90deg,transparent 40px,var(--margin) 40px,var(--margin) 42px,transparent 42px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);
  background-position:0 0,0 14px;box-shadow:0 14px 36px rgba(0,0,0,.45);transform-origin:50% 120%}
.card .meta{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8b84a6;font-family:var(--ui);margin-bottom:4px}
.card .meta .cat.spicy{color:#d63f6f;font-weight:600}
.card .lead{font-family:var(--hand);font-size:30px;font-weight:700;color:#5b4fa8;line-height:34px}
.card .q{font-family:var(--hand);font-size:34px;line-height:34px;font-weight:500;text-wrap:balance;margin-top:0}
.card .q.th{font-size:27px}
.card .foot{position:absolute;left:54px;right:22px;bottom:12px;display:flex;justify-content:space-between;font-size:12px;color:#8b84a6;font-variant-numeric:tabular-nums}
.deal-in{animation:dealIn .55s cubic-bezier(.2,.9,.25,1.15) both}
.deal-out{animation:dealOut .4s ease-in both}
@keyframes dealIn{from{transform:translate(70%,-30px) rotate(14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes dealOut{to{transform:translate(-90%,40px) rotate(-18deg);opacity:0}}
.navrow{display:flex;justify-content:space-between;gap:8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;background:var(--night-2);border:1px solid var(--line);color:#f2effa;text-align:center}
.btn:hover{border-color:#5a5290}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.btn.lamp{background:var(--lamp);color:#2a2112;border-color:var(--lamp)}

/* answer pad */
.pad{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pad h3,.partner h3{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{all:unset;cursor:pointer;text-align:center;padding:14px 8px;border-radius:14px;font-family:var(--hand);font-size:28px;font-weight:700;border:2px solid var(--line);transition:transform .15s}
.yn button:active{transform:scale(.96)}
.yn .y{color:var(--yes)} .yn .n{color:var(--no)}
.yn .y[aria-pressed="true"]{background:var(--yes);color:#fff;border-color:var(--yes)}
.yn .n[aria-pressed="true"]{background:var(--no);color:#fff;border-color:var(--no)}
.yn button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.txt{position:relative}
textarea{width:100%;min-height:92px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:#1a1630;color:#fff;padding:12px 52px 12px 12px;font:inherit;font-size:16px}
textarea:focus{outline:2px solid var(--lamp);outline-offset:1px}
.mic{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--night);color:var(--lamp);cursor:pointer;display:grid;place-items:center}
.mic.live{background:var(--yes);color:#fff;border-color:var(--yes);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,93,143,.2)}}
.hint{font-size:12.5px;color:var(--ink-soft)}
.partial{color:var(--lamp);font-style:italic}

/* partner card (flip) */
.partner{display:flex;flex-direction:column;gap:10px}
.flip{perspective:1200px}
.flip-in{position:relative;transition:transform .7s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;min-height:150px}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;padding:16px 18px}
.back{background:repeating-linear-gradient(45deg,#3b3166 0 12px,#342b5c 12px 24px);border:1px solid #4e4385;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#d9d3f5}
.back b{font-family:var(--hand);font-size:26px;color:var(--lamp)}
.front{transform:rotateY(180deg);background:var(--paper);color:var(--paper-ink);background-image:repeating-linear-gradient(transparent 0 29px,var(--rule) 29px 30px);overflow:auto}
.front .who{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b84a6}
.front .verdict{font-family:var(--hand);font-size:30px;font-weight:700;line-height:32px}
.front .verdict.y{color:#d63f6f}.front .verdict.n{color:#1f8f81}
.front .said{font-family:var(--hand);font-size:24px;line-height:30px;white-space:pre-wrap;overflow-wrap:anywhere}
.front .orig{font-size:12.5px;color:#7a7396;margin-top:6px;overflow-wrap:anywhere}
.front a,.front button.link{color:#5b4fa8;font-size:12.5px;background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:12.5px;text-decoration:underline}
.flip.static .flip-in{transform:none}.flip.static .front{transform:none;position:relative}.flip.static .back{display:none}

/* history */
.hist{display:flex;flex-direction:column;gap:12px}
.hcard{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hcard .hq{font-family:var(--hand);font-size:24px;line-height:1.1;font-weight:700;color:#3b3270}
.hans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hans>div{min-width:0;border-top:1px dashed #d4cde6;padding-top:6px}
.hans .who{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#8b84a6}
.hans .v{font-family:var(--hand);font-size:22px;font-weight:700}
.hans .v.y{color:#d63f6f}.hans .v.n{color:#1f8f81}.hans .v.w{color:#aaa3c4;font-weight:500}
.hans .t{font-family:var(--hand);font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.empty{color:var(--ink-soft);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:14px}
.score{display:flex;gap:10px;flex-wrap:wrap}
.score div{flex:1;min-width:120px;background:var(--night-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.score b{display:block;font-family:var(--hand);font-size:30px;color:var(--lamp);line-height:1}
.score span{font-size:12px;color:var(--ink-soft)}
.setup{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.setup input{width:100%;border-radius:10px;border:1px solid var(--line);background:#1a1630;color:#fff;padding:10px 12px;font:inherit;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lamp);color:#2a2112;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20;max-width:calc(100% - 32px)}
@media (max-width:420px){.card .q{font-size:30px}.card{padding-left:50px}.hans{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.deal-in,.deal-out,.mic.live{animation:none}.flip-in{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand" id="brand">Nikdy jsem…<small id="sub">hra pro dva na dálku</small></div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lcs" aria-pressed="true">🇨🇿 CZ</button>
      <button id="lth" aria-pressed="false">🇹🇭 TH</button>
    </div>
  </header>

  <div class="status" id="status"><span class="dot" id="sdot"></span><span id="stext">…</span><button class="chip" id="invite" hidden></button></div>

  <section class="setup" id="setup" hidden>
    <h3 style="margin:0;font-size:15px" id="setupT"></h3>
    <input id="nick" maxlength="24" autocomplete="off">
    <div class="row" id="genderRow">
      <span class="hint" id="genderL"></span>
      <div class="seg" role="group">
        <button id="gm" aria-pressed="false"></button>
        <button id="gf" aria-pressed="false"></button>
      </div>
    </div>
    <button class="btn lamp" id="saveNick"></button>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tPlay" aria-selected="true"></button>
    <button class="tab" role="tab" id="tHist" aria-selected="false"></button>
    <button class="tab" role="tab" id="tSet" aria-selected="false"></button>
  </div>

  <main id="play">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="chips" id="cats"></div>
      <div class="table">
        <div class="stack"><i></i><i></i></div>
        <article class="card" id="card" aria-live="polite"></article>
      </div>
      <div class="navrow">
        <button class="btn ghost" id="prev">←</button>
        <button class="btn ghost" id="shuffle"></button>
        <button class="btn lamp" id="next"></button>
      </div>

      <section class="pad">
        <h3 id="youT"></h3>
        <div class="yn">
          <button class="y" id="yes" aria-pressed="false"></button>
          <button class="n" id="no" aria-pressed="false"></button>
        </div>
        <div class="txt">
          <textarea id="text"></textarea>
          <button class="mic" id="mic" hidden aria-label="Dictate">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
        </div>
        <div class="hint" id="micHint"></div>
        <div class="partial" id="partial" hidden></div>
        <button class="btn lamp" id="send"></button>
      </section>

      <section class="partner">
        <h3 id="partnerT"></h3>
        <div class="flip" id="flip">
          <div class="flip-in">
            <div class="face back" id="pback"></div>
            <div class="face front" id="pfront"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <main id="hist" hidden></main>
  <main id="set" hidden></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- questions: category | česky (po „Nikdy jsem“) | ไทย (หลัง „ฉันไม่เคย“) ----------
   {a} = mužský/ženský tvar (spal / spala), {x|y} = muž | žena */
const RAW = `
life|nelhal{a} o svém věku|โกหกเรื่องอายุของตัวเอง
life|nebrečel{a} u filmu|ร้องไห้ตอนดูหนัง
life|nezpíval{a} karaoke před lidmi|ร้องคาราโอเกะต่อหน้าคนอื่น
life|nedal{a} výpověď z práce ze dne na den|ลาออกจากงานแบบกะทันหัน
life|nemiloval{a} svého mazlíčka víc než většinu lidí|รักสัตว์เลี้ยงมากกว่าคนส่วนใหญ่
life|nespal{a} až do odpoledne|นอนตื่นสายจนถึงบ่าย
life|se nenechal{a} potetovat|สักลาย
life|nepřemýšlel{a} o tom, že úplně změním kariéru|คิดจะเปลี่ยนอาชีพไปเลย
life|neutratil{a} celou výplatu za jeden víkend|ใช้เงินเดือนหมดในสุดสัปดาห์เดียว
life|nedostal{a} pokutu od policie|โดนตำรวจปรับ
life|netancoval{a} na stole|เต้นบนโต๊ะ
life|se neopil{a} tak, že nevím, jak jsem se dostal{a} domů|เมาจนจำไม่ได้ว่ากลับบ้านยังไง
life|nezkoušel{a} meditovat|ลองนั่งสมาธิ
life|nepřečetl{a} knihu za jeden den|อ่านหนังสือจบในวันเดียว
life|nezačal{a} vlastní podnikání|เริ่มทำธุรกิจของตัวเอง
life|nelitoval{a} nového účesu|ตัดผมแล้วเสียใจทีหลัง
life|neprojížděl{a} něčí Instagram celé hodiny|ส่องไอจีของใครบางคนเป็นชั่วโมง
life|nezablokoval{a} někoho po hádce|บล็อกใครบางคนหลังทะเลาะกัน
life|nepředstíral{a} nemoc, abych nemusel{a} do práce|แกล้งป่วยเพื่อจะได้ไม่ต้องไปทำงาน
life|nemluvil{a} {sám|sama} se sebou nahlas|พูดกับตัวเองเสียงดัง
life|se nebál{a} tmy i jako dospěl{ý|á}|กลัวความมืดแม้จะโตแล้ว
life|nevěřil{a} na duchy|เชื่อเรื่องผี
life|nebyl{a} u věštkyně nebo kartářky|ไปดูดวง
life|nevyhrál{a} žádnou soutěž|ชนะการแข่งขันหรือการประกวด
life|si nezlomil{a} kost|กระดูกหัก
life|nestrávil{a} noc v nemocnici|นอนค้างคืนที่โรงพยาบาล
life|nesnil{a} o tom, že budu slavn{ý|á}|ฝันอยากเป็นคนดัง
life|nebrečel{a} v práci|ร้องไห้ที่ทำงาน
life|se nepohádal{a} se šéfem|ทะเลาะกับเจ้านาย
life|nepracoval{a} na noční směny|ทำงานกะดึก
life|neinvestoval{a} do kryptoměn nebo akcií|ลงทุนในคริปโตหรือหุ้น
life|nepůjčil{a} peníze, které už jsem nikdy neviděl{a}|ให้ยืมเงินแล้วไม่เคยได้คืน
life|nelhal{a} v životopise|โกหกในเรซูเม่
life|nebyl{a} na koncertě {sám|sama}|ไปดูคอนเสิร์ตคนเดียว
life|neviděl{a} východ slunce po probdělé noci|ดูพระอาทิตย์ขึ้นหลังจากไม่ได้นอนทั้งคืน
life|nezměnil{a} názor na něco zásadního kvůli jednomu člověku|เปลี่ยนความคิดเรื่องสำคัญเพราะคนคนเดียว
life|nebyl{a} na terapii nebo u psychologa|ไปพบนักบำบัดหรือนักจิตวิทยา
life|nepoznal{a}, co je to opravdová samota|รู้จักความเหงาที่แท้จริง
life|nedělal{a} něco jen proto, abych udělal{a} radost rodičům|ทำอะไรบางอย่างเพียงเพื่อให้พ่อแม่ดีใจ
life|nesnil{a} o tom, že budu žít u moře|ฝันว่าจะได้อยู่ริมทะเล
past|neutekl{a} z domova|หนีออกจากบ้าน
past|nekouřil{a} tajně před rodiči|แอบสูบบุหรี่ไม่ให้พ่อแม่รู้
past|nelhal{a} rodičům, kde jsem byl{a} v noci|โกหกพ่อแม่ว่าเมื่อคืนไปอยู่ที่ไหน
past|neopakoval{a} ročník ve škole|เรียนซ้ำชั้น
past|nebyl{a} vyhozen{ý|á} z hodiny|โดนไล่ออกจากห้องเรียน
past|neopisoval{a} při testu|ลอกข้อสอบ
past|neukradl{a} nic z obchodu|ขโมยของในร้าน
past|neměl{a} imaginárního kamaráda|มีเพื่อนในจินตนาการ
past|nebyl{a} šikanovan{ý|á}|โดนบูลลี่
past|nehrál{a} na hudební nástroj|เล่นเครื่องดนตรี
past|nedělal{a} sport závodně|เล่นกีฬาแบบแข่งขัน
past|neměl{a} účes, za který se dnes stydím|มีทรงผมที่ตอนนี้อายมาก
past|nepsal{a} si deník|เขียนไดอารี่
past|nerozbil{a} něco drahého a nesvedl{a} to na někoho jiného|ทำของแพงพังแล้วโทษคนอื่น
past|nebyl{a} zamilovan{ý|á} do učitele nebo učitelky|แอบชอบครู
past|nebydlel{a} v jiné zemi|เคยอาศัยอยู่ต่างประเทศ
past|se nepral{a} se sourozencem|ทะเลาะชกต่อยกับพี่น้อง
past|neřekl{a} rodičům, že je nenávidím|บอกพ่อแม่ว่าเกลียดพวกเขา

/* ---------- helpers ---------- */
function gform(s,g){
  return s.replace(/\{([^{}|]*)\|([^{}]*)\}/g,(m,a,b)=>g==="m"?a:g==="f"?b:a+"/"+b)
          .replace(/\{a\}/g,g==="m"?"":g==="f"?"a":"(a)");
}
function qText(q,lang){return lang==="th"?q.th:gform(q.cs,S.gender)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function deck(){const r=rng(S.game.seed);const ids=Q.filter(q=>S.game.cats.includes(q.c)).map(q=>q.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}return ids}
function current(){const d=deck();if(!d.length)return null;const p=((S.game.pos%d.length)+d.length)%d.length;return {q:Q.find(x=>x.id===d[p]),p,n:d.length}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let toastT;function toast(m){const el=$("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
function partnerId(){const ids=new Set([...Object.keys(S.players),...Object.values(S.answers).map(a=>a.uid)]);ids.delete(me);return [...ids][0]||null}
function ans(qid,uid){return uid?S.answers[qid+"__"+uid]:null}
function textFor(a,lang){if(!a)return "";return a[lang]||a.text||""}
function gtLink(text,to){return "https://translate.google.com/?sl=auto&tl="+to+"&text="+encodeURIComponent(text)+"&op=translate"}

function renderCard(anim){
  const c=current(),card=$("card");
  if(!c){card.innerHTML=`<div class="lead">${esc(t("onlyQ"))}</div>`;return}
  const {q,p,n}=c;
  const draw=()=>{
    card.innerHTML=`<div class="meta"><span class="cat${q.c==="spicy"?" spicy":""}">${esc(t("cats")[q.c])}</span><span>${S.lang==="cs"?"ฉันไม่เคย…":"Nikdy jsem…"}</span></div>
      <div class="lead">${esc(t("lead"))}</div><div class="q ${S.lang}">${esc(qText(q,S.lang))}</div>
      <div class="foot"><span>${esc(S.lang==="cs"?q.th:gform(q.cs,S.gender))}</span><span>${p+1}/${n}</span></div>`;
    card.querySelector(".foot span").style.cssText="opacity:.75;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
  };
  if(anim){card.classList.remove("deal-in");card.classList.add("deal-out");setTimeout(()=>{draw();card.classList.remove("deal-out");void card.offsetWidth;card.classList.add("deal-in")},360)}
  else draw();
  if(S.lastQid!==q.id){S.lastQid=q.id;const mine=ans(q.id,me);S.choice=mine?.did||null;$("text").value=mine?(mine.text||""):"";S.dirty=false;$("flip").classList.remove("open")}
  renderPad();renderPartner();
}
function renderPad(){
  const c=current();if(!c)return;const mine=ans(c.q.id,me);
  $("yes").setAttribute("aria-pressed",S.choice==="yes");$("no").setAttribute("aria-pressed",S.choice==="no");
  $("send").textContent=mine&&!S.dirty?("✓ "+t("sent")):(mine?t("update"):t("send"));
  $("send").disabled=!!(mine&&!S.dirty);
}
function renderPartner(){
  const c=current();if(!c)return;const pid=partnerId(),pa=ans(c.q.id,pid),mine=ans(c.q.id,me),pn=(pid&&S.players[pid]?.nick)||t("them");
  $("partnerT").textContent=t("partner")+(pid?" · "+pn:"");
  const flip=$("flip");
  if(!pa){flip.classList.remove("open");$("pback").innerHTML=`<b>${esc(t("waiting"))}</b><span>${esc(t("waitingSub"))}</span>`;return}
  if(!mine){flip.classList.remove("open");$("pback").innerHTML=`<b>${esc(pn)} ${esc(t("partnerAns"))}</b><span>${esc(t("hiddenSub"))}</span>`;return}
  const said=textFor(pa,S.lang),hasTr=!!pa[S.lang];
  let extra="";
  if(pa.text&&pa.lang!==S.lang){
    extra=`<div class="orig">${esc(t("orig"))}: ${esc(pa.text)}</div><div class="orig">`+
      (!hasTr&&canTranslate?`<button class="link" data-tr="${esc(pa.qid+"__"+pa.uid)}">${esc(t("translate"))}</button> · `:"")+
      `<a href="${gtLink(pa.text,S.lang)}" target="_blank" rel="noopener">${esc(t("gt"))}</a></div>`;
  }
  $("pfront").innerHTML=`<div class="who">${esc(pn)}</div><div class="verdict ${pa.did==="yes"?"y":"n"}">${esc(pa.did==="yes"?t("did"):t("didnt"))}</div>
    ${said?`<div class="said">${esc(said)}</div>`:""}${extra}`;
  // size the flip box to its content
  requestAnimationFrame(()=>{const h=$("pfront").scrollHeight;flip.querySelector(".flip-in").style.minHeight=Math.max(150,h)+"px"});
  if(!flip.classList.contains("open"))setTimeout(()=>flip.classList.add("open"),80);
}
function renderHist(){
  const pid=partnerId(),pn=(pid&&S.players[pid]?.nick)||t("them");
  const qids=[...new Set(Object.values(S.answers).map(a=>a.qid))].map(id=>Q.find(q=>q.id===id)).filter(Boolean)
    .sort((a,b)=>Math.max(...Object.values(S.answers).filter(x=>x.qid===b.id).map(x=>x.ts||0))-Math.max(...Object.values(S.answers).filter(x=>x.qid===a.id).map(x=>x.ts||0)));
  if(!qids.length){$("hist").innerHTML=`<div class="empty">${esc(t("noHist"))}</div>`;return}
  let both=0,match=0,full=0;
  for(const q of qids){const a=ans(q.id,me),b=ans(q.id,pid);if(a&&b){full++;if(a.did===b.did)match++;if(a.did==="yes"&&b.did==="yes")both++}}
  const cell=(a,who,isMe)=>{
    if(!a)return `<div><div class="who">${esc(who)}</div><div class="v w">${esc(t("waitShort"))}</div></div>`;
    const myA=ans(a.qid,me);const hide=!isMe&&!myA;
    return `<div><div class="who">${esc(who)}</div>${hide?`<div class="v w">🔒</div>`:`<div class="v ${a.did==="yes"?"y":"n"}">${esc(a.did==="yes"?t("did"):t("didnt"))}</div>${textFor(a,S.lang)?`<div class="t">${esc(textFor(a,S.lang))}</div>`:""}`}</div>`;
  };
  $("hist").innerHTML=`<div class="hist"><div class="score"><div><b>${qids.length}</b><span>${esc(t("answered"))}</span></div><div><b>${full?Math.round(match/full*100):0}%</b><span>${esc(t("match"))}</span></div><div><b>${both}</b><span>${esc(t("both"))}</span></div></div>`+
    qids.map(q=>`<div class="hcard"><div class="hq">${esc(t("lead"))} ${esc(qText(q,S.lang))}</div><div class="hans">${cell(ans(q.id,me),S.nick||t("me"),true)}${cell(ans(q.id,pid),pn,false)}</div></div>`).join("")+`</div>`;
}

/* ---------- shared game state ---------- */
function setGame(patch,anim=true){
  S.game={...S.game,...patch};renderAll(anim);
  if(online){S.localTs=Date.now();api("state",{...S.game,by:me,ts:S.localTs})}
}
async function savePlayer(){
  if(!online)return;
  api("player",{nick:S.nick||"",lang:S.lang,ts:Date.now()});
}
async function translate(text,from){
  if(!text)return null;
  try{const r=await fetch("/api/translate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text,from})});
    if(!r.ok)return null;const j=await r.json();if(typeof j.cs==="string"&&typeof j.th==="string")return j}catch(e){}
  return null;
}
async function submit(){
  const c=current();if(!c)return;
  if(!S.choice){toast(t("pick"));return}
  const text=$("text").value.trim();
  const rec={qid:c.q.id,uid:me,nick:S.nick||"",did:S.choice,text,lang:S.lang,ts:Date.now(),cs:"",th:""};
  rec[S.lang]=text;
  const key=c.q.id+"__"+me;
  S.answers[key]=rec;S.dirty=false;renderPad();renderPartner();
  if(text&&canTranslate){$("send").textContent=t("translating");const tr=await translate(text,S.lang);if(tr){rec.cs=tr.cs;rec.th=tr.th;rec[S.lang]=text}}
  if(online){if(!(await api("answer",rec)))toast("⚠ Offline")}
  LS.set("answers_"+ROOM,S.answers);
  renderPad();toast("✓ "+t("sent"));
}

$("mic").onclick=()=>{

/* ---------- boot ---------- */
S.answers=LS.get("answers_"+ROOM,{});
/* dictation: browser speech recognition (Chrome, Android, Safari 14.5+) */
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  let rec=null,state="idle";const H={final:[],partial:[],state:[]};
  const emit=(k,v)=>H[k].forEach(f=>f(v));const setState=(st)=>{state=st;emit("state",{state:st})};
  dict={active:()=>state!=="idle",
    start(opts){return new Promise((res,rej)=>{
      rec=new SR();rec.lang=(opts&&opts.language)==="th"?"th-TH":"cs-CZ";rec.interimResults=true;rec.continuous=true;
      rec.onstart=()=>{setState("listening");res()};
      rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)emit("final",{text:" "+r[0].transcript.trim()});else interim+=r[0].transcript}emit("partial",{text:interim})};
      rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")rej({code:"not_granted"});else if(e.error!=="no-speech"&&e.error!=="aborted")rej({code:"unavailable"})};
      rec.onend=()=>{emit("partial",{text:""});setState("idle")};
      try{setState("starting");rec.start()}catch(err){setState("idle");rej({code:"unavailable"})}
    })},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()},
    onFinal:f=>H.final.push(f),onPartial:f=>H.partial.push(f),onState:f=>H.state.push(f)};
})();
if(dict){
  dict.onFinal(({text})=>{const ta=$("text");ta.value=ta.value?ta.value+text:text.replace(/^\s+/,"");S.dirty=true;renderPad()});
  dict.onPartial(({text})=>{$("partial").hidden=!text;$("partial").textContent=text});
  dict.onState(({state})=>{$("mic").classList.toggle("live",state!=="idle");if(state==="idle")$("partial").hidden=true});
}
renderAll(false);

/* sync: poll the room every few seconds */
let polling=false;
async function poll(){
  if(polling||document.hidden)return;polling=true;
  try{
    const r=await fetch("/api/room?room="+encodeURIComponent(ROOM),{cache:"no-store"});
    if(r.status===503){dbDown=true;online=false;renderChrome();return}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();dbDown=false;
    if(!online){online=true;if(S.nick)savePlayer()}
    S.players=j.players||{};
    const m={};for(const [k,v] of Object.entries(j.answers||{}))if(v&&v.qid&&v.uid)m[k]=v;
    // keep my newer local copies (just sent, server not yet updated)
    for(const [k,v] of Object.entries(S.answers))if(v.uid===me&&(!m[k]||(m[k].ts||0)<(v.ts||0)))m[k]=v;
    S.answers=m;LS.set("answers_"+ROOM,m);
    const d=j.state;
    if(d&&(d.ts||0)>(S.localTs||0)){
      const changed=d.pos!==S.game.pos||d.seed!==S.game.seed||JSON.stringify(d.cats)!==JSON.stringify(S.game.cats);
      S.localTs=d.ts;S.game={cats:Array.isArray(d.cats)?d.cats.filter(x=>CATS.includes(x)):CATS.slice(),seed:d.seed|0,pos:d.pos|0};
      if(changed){renderAll(d.by!==me);polling=false;return}
    }
    renderChrome();renderPad();renderPartner();if(S.view==="hist")renderHist();
  }catch(e){}finally{polling=false}
}
poll();setInterval(poll,2500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
</script>
</body>
</html>
